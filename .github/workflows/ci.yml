name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: make lint
      - run: make test

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # renovate: datasource=github-tags depName=zizmorcore/zizmor
      ZIZMOR_VERSION: v1.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          # Fail the job on findings. Uploaded results never satisfied the
          # ruleset's code scanning rule, so this job is the gate instead.
          advanced-security: false

  renovate-config-validator:
    name: renovate-config-validator
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: 44.52.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Node is the interpreter, not a dependency; renovate's own hook says lts.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "lts/*"
      - run: npx --yes --package "renovate@$RENOVATE_VERSION" -- renovate-config-validator --strict
